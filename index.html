<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Clone</title>
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-main: #131314;
            --bg-sidebar: #1e1f20;
            --bg-input: #1e1f20;
            --user-bubble: #1e1f20;
            --text-primary: #e3e3e3;
            --text-secondary: #c4c7c5;
            --hover-gray: #333537;
            --border-color: #444746;
            --gradient-start: rgba(26, 43, 80, 0.4);
            --gradient-end: rgba(19, 19, 20, 1);
            --code-bg: #282a2c;
            --scrollbar-thumb: #444746;
        }

        body.light-mode {
            --bg-main: #ffffff;
            --bg-sidebar: #f0f4f9;
            --bg-input: #f0f4f9;
            --user-bubble: #e1e5ea;
            --text-primary: #1f1f1f;
            --text-secondary: #444746;
            --hover-gray: #d3d7db;
            --border-color: #c7c7c7;
            --gradient-start: #e8f0fe;
            --gradient-end: #ffffff;
            --code-bg: #e8eaed;
            --scrollbar-thumb: #a0a3a5;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { display: flex; height: 100vh; background-color: var(--bg-main); color: var(--text-primary); overflow: hidden; transition: background-color 0.3s, color 0.3s; }

        .sidebar { 
            width: 280px; background-color: var(--bg-sidebar); display: flex; flex-direction: column; 
            padding: 16px; transition: width 0.3s ease, background-color 0.3s ease, padding 0.3s ease; 
            overflow: hidden; white-space: nowrap; z-index: 10; flex-shrink: 0;
        }
        
        .sidebar.collapsed { width: 72px; padding: 16px 12px; background-color: transparent; }
        .sidebar.collapsed .nav-text, .sidebar.collapsed .close-btn { display: none; }
        
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; height: 48px; }
        .sidebar.collapsed .sidebar-header { padding: 0; justify-content: center; }
        
        .logo-area { display: flex; align-items: center; gap: 8px; }
        .sidebar.collapsed .logo-area { width: 48px; justify-content: center; margin: 0; padding: 0; }
        
        .app-icon-wrapper {
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            border-radius: 50%; cursor: default; transition: background-color 0.2s;
        }
        .sidebar.collapsed .app-icon-wrapper { width: 48px; height: 48px; margin: 0; cursor: pointer; }
        
        .sidebar.collapsed .app-icon-wrapper:hover { background-color: transparent; }
        
        .app-icon-default { color: #d96570; font-size: 24px; }
        .app-icon-hover { display: none; color: var(--text-secondary); font-size: 24px; }
        
        .sidebar.collapsed .app-icon-wrapper:hover .app-icon-default { display: none; }
        .sidebar.collapsed .app-icon-wrapper:hover .app-icon-hover { display: block; }
        
        .close-btn { color: var(--text-secondary); cursor: pointer; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
        .close-btn:hover { background-color: var(--hover-gray); }
        
        .new-chat-btn {
            display: flex; align-items: center; gap: 12px; background-color: var(--bg-main); padding: 12px 16px; 
            border-radius: 12px; cursor: pointer; color: var(--text-secondary); font-size: 14px; border: 1px solid var(--border-color);
            transition: all 0.3s; height: 48px; overflow: hidden;
        }
        .new-chat-btn:hover { background-color: var(--hover-gray); }
        .sidebar.collapsed .new-chat-btn { 
            width: 48px; margin: 0 auto; padding: 0; justify-content: center; 
            border-radius: 50%; border-color: transparent; background-color: transparent; 
        }

        .spacer { flex: 1; }

        .settings-btn {
            display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 8px; cursor: pointer; color: var(--text-secondary); font-size: 14px;
            transition: all 0.3s; height: 48px; overflow: hidden;
        }
        .settings-btn:hover { background-color: var(--hover-gray); }
        .sidebar.collapsed .settings-btn { 
            width: 48px; margin: 0 auto; padding: 0; justify-content: center; 
            border-radius: 50%; background-color: transparent; 
        }

        .main-content {
            flex: 1; display: flex; flex-direction: column; position: relative; margin-left: -72px;
            background: radial-gradient(circle at 50% 50%, var(--gradient-start) 0%, var(--gradient-end) 100%);
        }

        .main-wrapper {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            width: 100%; padding-left: 72px; overflow-y: auto; overflow-x: hidden; position: relative;
        }

        .top-nav { width: 100%; display: flex; justify-content: flex-start; padding: 16px 24px; min-height: 56px; flex-shrink: 0; }
        
        .welcome-text { font-size: 32px; font-weight: 400; text-align: center; margin: auto 0; transition: opacity 0.3s; }
        
        .chat-container {
            width: 100%; max-width: 840px; padding: 20px 20px 40px 20px;
            display: none; flex-direction: column; gap: 32px; margin: auto auto 0 auto;
        }

        .main-wrapper.chat-active .chat-container { display: flex; }
        .main-wrapper.chat-active .welcome-text { display: none; }

        .input-container { 
            position: sticky; bottom: 0; width: 100%; max-width: 840px; margin: 0 auto; 
            padding: 20px 20px 32px 20px; flex-shrink: 0;
            background: transparent; pointer-events: none; z-index: 5;
        }

        .message-row { display: flex; flex-direction: column; gap: 12px; position: relative; width: 100%; }
        
        .user-message {
            align-self: flex-end; background-color: var(--user-bubble); padding: 14px 20px;
            border-radius: 24px; max-width: 80%; font-size: 15px; line-height: 1.5;
            color: var(--text-primary); transition: background-color 0.3s;
        }
        
        .ai-message { 
            align-self: flex-start; display: flex; gap: 16px; align-items: flex-start; 
            max-width: 100%; line-height: 1.6; font-size: 15px; width: 100%;
        }
        
        .ai-avatar {
            width: 30px; height: 30px; min-width: 30px; min-height: 30px; flex-shrink: 0;
            border-radius: 50%; background: linear-gradient(135deg, #a8c7fa, #d96570);
            display: flex; align-items: center; justify-content: center;
        }
        
        .ai-avatar .material-symbols-outlined { font-size: 18px; color: #131314; display: block; }
        
        .ai-text { padding-top: 3px; width: 100%; text-align: justify; overflow-wrap: break-word; }
        
        .ai-text p { margin-bottom: 12px; }
        .ai-text p:last-child { margin-bottom: 0; }
        .ai-text strong { font-weight: 600; color: var(--text-primary); }
        .ai-text pre { background-color: var(--code-bg); padding: 12px 16px; border-radius: 8px; overflow-x: auto; margin: 12px 0; border: 1px solid var(--border-color); transition: background-color 0.3s; }
        .ai-text code { font-family: monospace; background-color: var(--code-bg); padding: 2px 6px; border-radius: 4px; font-size: 0.9em; transition: background-color 0.3s; }
        .ai-text pre code { background-color: transparent; padding: 0; font-size: 14px; }
        .ai-text ul, .ai-text ol { margin: 12px 0 12px 24px; text-align: left; }
        .ai-text a { color: var(--accent-blue); text-decoration: none; }
        .ai-text a:hover { text-decoration: underline; }

        .input-box {
            display: flex; align-items: center; background-color: var(--bg-input); border-radius: 32px;
            padding: 12px 24px; gap: 16px; border: 1px solid var(--border-color); transition: border-color 0.2s, background-color 0.3s;
            pointer-events: auto;
        }
        .input-box:focus-within { border-color: #888; }
        input[type="text"] { flex: 1; background: transparent; border: none; color: var(--text-primary); font-size: 16px; outline: none; padding: 8px 0; }

        .loading-shimmer {
            height: 16px; width: 200px; margin-top: 7px;
            background: linear-gradient(90deg, var(--bg-sidebar) 25%, var(--border-color) 50%, var(--bg-sidebar) 75%);
            background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px; 
        }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo-area">
                <div class="app-icon-wrapper" id="app-icon-wrapper" title="Expand menu">
                    <span class="material-symbols-outlined app-icon-default">temp_preferences_custom</span>
                    <span class="material-symbols-outlined app-icon-hover">left_panel_open</span>
                </div>
                <span class="nav-text" style="font-size:18px; font-weight:500;">Gemini</span>
            </div>
            <span class="material-symbols-outlined close-btn" id="close-sidebar-btn" title="Collapse menu">left_panel_close</span>
        </div>
        
        <div class="new-chat-btn" onclick="resetChat()" title="New chat">
            <span class="material-symbols-outlined">add</span> 
            <span class="nav-text">New chat</span>
        </div>

        <div class="spacer"></div> 

        <div class="settings-btn" onclick="toggleTheme()" title="Settings">
            <span class="material-symbols-outlined" id="theme-icon">light_mode</span> 
            <span class="nav-text" id="theme-text">Toggle light mode</span>
        </div>
    </div>

    <div class="main-content">
        <div class="main-wrapper" id="main-wrapper">
            
            <div class="top-nav"></div>
            
            <div class="welcome-text" id="welcome-text">What should we focus on?</div>
            
            <div class="chat-container" id="chat-container"></div>

            <div class="input-container">
                <div class="input-box">
                    <input type="text" id="userInput" placeholder="Ask Gemini" autocomplete="off">
                    <span class="material-symbols-outlined" id="send-btn" onclick="sendData()" style="cursor:pointer; color:var(--text-secondary);">send</span>
                </div>
            </div>

        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const inputField = document.getElementById('userInput');
        const mainWrapper = document.getElementById('main-wrapper');
        const welcomeText = document.getElementById('welcome-text');
        
        const sidebar = document.getElementById('sidebar');
        const closeSidebarBtn = document.getElementById('close-sidebar-btn');
        const appIconWrapper = document.getElementById('app-icon-wrapper');

        closeSidebarBtn.addEventListener('click', () => sidebar.classList.add('collapsed'));
        appIconWrapper.addEventListener('click', () => {
            if (sidebar.classList.contains('collapsed')) sidebar.classList.remove('collapsed');
        });

        const greetings = [
            "What should we focus on?", "How can I help you today?", 
            "What's on your mind?", "Ready to build something?", "Let's explore something new."
        ];

        function setRandomWelcome() {
            welcomeText.innerText = greetings[Math.floor(Math.random() * greetings.length)];
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            document.getElementById('theme-icon').innerText = isLight ? 'dark_mode' : 'light_mode';
            document.getElementById('theme-text').innerText = isLight ? 'Toggle dark mode' : 'Toggle light mode';
            window.va('event', { name: 'Theme Toggled', data: { theme: isLight ? 'light' : 'dark' } });
        }

        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
            document.getElementById('theme-icon').innerText = 'dark_mode';
            document.getElementById('theme-text').innerText = 'Toggle dark mode';
        }

        inputField.addEventListener("keypress", (e) => {
            if (e.key === "Enter") { e.preventDefault(); sendData(); }
        });

        async function loadData() {
            const res = await fetch('/api/data');
            const json = await res.json();
            chatContainer.innerHTML = '';
            
            if (Object.keys(json.data).length > 0) {
                mainWrapper.classList.add('chat-active'); 
                for (const [id, interaction] of Object.entries(json.data)) {
                    addMessageToUI(id, interaction.user, interaction.ai);
                }
                scrollToBottom();
            } else {
                mainWrapper.classList.remove('chat-active'); 
                setRandomWelcome(); 
            }
        }

        async function resetChat() {
            await fetch('/api/reset', { method: 'DELETE' });
            window.va('event', { name: 'Chat Reset' });
            chatContainer.innerHTML = '';
            mainWrapper.classList.remove('chat-active'); 
            setRandomWelcome(); 
            inputField.value = '';
            inputField.focus();
        }

        function escapeHTML(str) { return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)); }

        function addMessageToUI(id, userText, aiText) {
            const wrapper = document.createElement('div');
            wrapper.className = 'message-row';
            wrapper.innerHTML = `
                <div class="user-message">${escapeHTML(userText)}</div>
                <div class="ai-message">
                    <div class="ai-avatar"><span class="material-symbols-outlined">temp_preferences_custom</span></div>
                    <div class="ai-text">${marked.parse(aiText)}</div>
                </div>
            `;
            chatContainer.appendChild(wrapper);
        }

        function scrollToBottom() { mainWrapper.scrollTop = mainWrapper.scrollHeight; }

        async function sendData() {
            const text = inputField.value.trim();
            if (!text) return;
            
            if (!mainWrapper.classList.contains('chat-active')) mainWrapper.classList.add('chat-active');

            inputField.value = '';
            inputField.disabled = true;

            const tempId = 'temp-' + Date.now();
            const wrapper = document.createElement('div');
            wrapper.className = 'message-row';
            wrapper.id = tempId;
            wrapper.innerHTML = `
                <div class="user-message">${escapeHTML(text)}</div>
                <div class="ai-message">
                    <div class="ai-avatar"><span class="material-symbols-outlined">temp_preferences_custom</span></div>
                    <div class="ai-text loading-shimmer"></div>
                </div>
            `;
            chatContainer.appendChild(wrapper);
            scrollToBottom();
            
            try {
                const response = await fetch('/api/data', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });
                
                if(!response.ok) throw new Error("API request failed");
                const result = await response.json();
                
                document.getElementById(tempId).remove();
                addMessageToUI(result.id, result.data.user, result.data.ai);
                window.va('event', { name: 'Message Sent' });
                
            } catch (error) {
                document.getElementById(tempId).remove();
                alert("Error connecting to LLM. Please try again.");
                window.va('event', { name: 'LLM Connection Error', data: { error: error.message } });
            } finally {
                inputField.disabled = false;
                inputField.focus();
                scrollToBottom();
            }
        }

        loadData();
    </script>
</body>
</html>
