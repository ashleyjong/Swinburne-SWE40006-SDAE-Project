<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Clone</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        /* Define Dark & Light Mode Variables */
        :root {
            --bg-main: #131314;
            --bg-sidebar: #1e1f20;
            --bg-input: #1e1f20;
            --text-primary: #e3e3e3;
            --text-secondary: #c4c7c5;
            --hover-gray: #333537;
            --border-color: #444746;
            --gradient-start: rgba(26, 43, 80, 0.4);
            --gradient-end: rgba(19, 19, 20, 1);
        }

        body.light-mode {
            --bg-main: #ffffff;
            --bg-sidebar: #f0f4f9;
            --bg-input: #f0f4f9;
            --text-primary: #1f1f1f;
            --text-secondary: #444746;
            --hover-gray: #e1e5ea;
            --border-color: #e0e0e0;
            --gradient-start: #e8f0fe;
            --gradient-end: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { display: flex; height: 100vh; background-color: var(--bg-main); color: var(--text-primary); overflow: hidden; transition: background-color 0.3s, color 0.3s; }

        /* --- SIDEBAR (Expandable & Collapsible) --- */
        .sidebar { 
            width: 280px; background-color: var(--bg-sidebar); display: flex; flex-direction: column; 
            padding: 16px; transition: width 0.3s ease, padding 0.3s ease; overflow: hidden; white-space: nowrap;
        }
        .sidebar.collapsed { width: 80px; padding: 16px 12px; } /* Slim mini-sidebar state */
        
        /* Hide text elements when collapsed */
        .sidebar.collapsed .nav-text, .sidebar.collapsed .close-btn { display: none; }
        
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; height: 40px; }
        .logo-area { display: flex; align-items: center; gap: 8px; }
        
        /* App Icon Logic */
        .app-icon-wrapper {
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            border-radius: 50%; cursor: default; transition: background-color 0.2s;
        }
        .app-icon-default { color: #d96570; font-size: 24px; }
        .app-icon-hover { display: none; color: var(--text-secondary); font-size: 24px; }
        
        /* When collapsed, hover effect swaps icons and enables clicking */
        .sidebar.collapsed .app-icon-wrapper { cursor: pointer; margin: 0 auto; }
        .sidebar.collapsed .app-icon-wrapper:hover { background-color: var(--hover-gray); }
        .sidebar.collapsed .app-icon-wrapper:hover .app-icon-default { display: none; }
        .sidebar.collapsed .app-icon-wrapper:hover .app-icon-hover { display: block; }
        
        .close-btn { color: var(--text-secondary); cursor: pointer; padding: 8px; border-radius: 50%; }
        .close-btn:hover { background-color: var(--hover-gray); }
        
        /* New Chat Button */
        .new-chat-btn {
            display: flex; align-items: center; gap: 12px; background-color: var(--bg-main); padding: 12px 16px; 
            border-radius: 12px; cursor: pointer; color: var(--text-secondary); font-size: 14px; border: 1px solid var(--border-color);
            transition: all 0.3s; height: 48px; overflow: hidden;
        }
        .new-chat-btn:hover { background-color: var(--hover-gray); }
        .sidebar.collapsed .new-chat-btn { width: 48px; margin: 0 auto; padding: 0; justify-content: center; border-radius: 50%; }

        .spacer { flex: 1; }

        /* Settings Button */
        .settings-btn {
            display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 8px; cursor: pointer; color: var(--text-secondary); font-size: 14px;
            transition: all 0.3s; height: 48px; overflow: hidden;
        }
        .settings-btn:hover { background-color: var(--hover-gray); }
        .sidebar.collapsed .settings-btn { width: 48px; margin: 0 auto; padding: 0; justify-content: center; border-radius: 50%; }

        /* --- MAIN CONTENT LAYOUT --- */
        .main-content {
            flex: 1; display: flex; flex-direction: column; position: relative;
            background: radial-gradient(circle at 50% 50%, var(--gradient-start) 0%, var(--gradient-end) 50%);
        }

        /* Restored top spacing (empty container) */
        .top-nav { display: flex; justify-content: flex-start; padding: 16px 24px; min-height: 56px; }

        /* State Manager: Center vs Bottom */
        .main-wrapper {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 100%; transition: justify-content 0.3s ease;
        }
        
        .welcome-text { font-size: 32px; font-weight: 400; text-align: center; margin-bottom: 40px; transition: opacity 0.3s; }
        
        .chat-container {
            width: 100%; max-width: 800px; flex: 1; overflow-y: auto; padding: 20px;
            display: none; flex-direction: column; gap: 32px; margin: 0 auto;
        }

        .input-container { width: 100%; max-width: 800px; padding: 0 20px 32px 20px; transition: all 0.3s; }

        /* Active Chat State Classes */
        .main-wrapper.chat-active { justify-content: flex-end; }
        .main-wrapper.chat-active .chat-container { display: flex; }
        .main-wrapper.chat-active .welcome-text { display: none; }

        /* --- MESSAGES --- */
        .message-row { display: flex; flex-direction: column; gap: 12px; position: relative; }
        .user-message {
            align-self: flex-end; background-color: var(--bg-sidebar); padding: 14px 20px;
            border-radius: 24px; max-width: 80%; font-size: 15px; line-height: 1.5;
        }
        
        /* Fixed Avatar Alignment: flex-start aligns to top row, margin-top visually centers it to the first line */
        .ai-message { 
            align-self: flex-start; display: flex; gap: 16px; align-items: flex-start; 
            max-width: 90%; line-height: 1.6; font-size: 15px; 
        }
        .ai-avatar {
            width: 30px; height: 30px; min-width: 30px; flex-shrink: 0;
            border-radius: 50%; background: linear-gradient(135deg, #a8c7fa, #d96570);
            display: flex; align-items: center; justify-content: center;
            margin-top: -3px; 
        }
        .ai-avatar .material-symbols-outlined { 
            font-size: 18px; color: #131314; margin: 0; padding: 0; line-height: 1; 
        }

        /* --- INPUT BOX --- */
        .input-box {
            display: flex; align-items: center; background-color: var(--bg-input); border-radius: 32px;
            padding: 12px 24px; gap: 16px; border: 1px solid var(--border-color); transition: border-color 0.2s;
        }
        .input-box:focus-within { border-color: #888; }
        .input-box .material-symbols-outlined { color: var(--text-secondary); cursor: pointer; font-size: 24px; }
        input[type="text"] {
            flex: 1; background: transparent; border: none; color: var(--text-primary); font-size: 16px; outline: none; padding: 8px 0;
        }

        /* Loading */
        .loading-shimmer {
            height: 20px; width: 200px; background: linear-gradient(90deg, var(--bg-sidebar) 25%, var(--border-color) 50%, var(--bg-sidebar) 75%);
            background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 4px; margin-top: 2px;
        }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo-area">
                <div class="app-icon-wrapper" id="app-icon-wrapper" title="Expand menu">
                    <span class="material-symbols-outlined app-icon-default">temp_preferences_custom</span>
                    <span class="material-symbols-outlined app-icon-hover">right_panel_open</span>
                </div>
                <span class="nav-text" style="font-size:18px; font-weight:500;">Gemini</span>
            </div>
            <span class="material-symbols-outlined close-btn" id="close-sidebar-btn" title="Collapse menu">left_panel_close</span>
        </div>
        
        <div class="new-chat-btn" onclick="resetChat()" title="New chat">
            <span class="material-symbols-outlined">add</span> 
            <span class="nav-text">New chat</span>
        </div>

        <div class="spacer"></div> 

        <div class="settings-btn" onclick="toggleTheme()" title="Settings">
            <span class="material-symbols-outlined" id="theme-icon">light_mode</span> 
            <span class="nav-text" id="theme-text">Toggle light mode</span>
        </div>
    </div>

    <div class="main-content">
        <!-- Re-added top nav for padding/spacing -->
        <div class="top-nav"></div>

        <!-- Dynamic Wrapper handles Centered vs Bottom Layout -->
        <div class="main-wrapper" id="main-wrapper">
            
            <div class="welcome-text" id="welcome-text">What should we focus on?</div>
            
            <div class="chat-container" id="chat-container"></div>

            <div class="input-container">
                <div class="input-box">
                    <input type="text" id="userInput" placeholder="Ask Gemini" autocomplete="off">
                    <span class="material-symbols-outlined" id="send-btn" onclick="sendData()" style="cursor:pointer; color:var(--text-secondary);">send</span>
                </div>
            </div>

        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const inputField = document.getElementById('userInput');
        const mainWrapper = document.getElementById('main-wrapper');
        const welcomeText = document.getElementById('welcome-text');
        
        // Sidebar Toggle Logic
        const sidebar = document.getElementById('sidebar');
        const closeSidebarBtn = document.getElementById('close-sidebar-btn');
        const appIconWrapper = document.getElementById('app-icon-wrapper');

        closeSidebarBtn.addEventListener('click', () => {
            sidebar.classList.add('collapsed');
        });

        appIconWrapper.addEventListener('click', () => {
            if (sidebar.classList.contains('collapsed')) {
                sidebar.classList.remove('collapsed');
            }
        });

        // Array of dynamic greetings
        const greetings = [
            "What should we focus on?",
            "How can I help you today?",
            "What's on your mind?",
            "Ready to build something?",
            "Let's explore something new."
        ];

        function setRandomWelcome() {
            const randomGreeting = greetings[Math.floor(Math.random() * greetings.length)];
            welcomeText.innerText = randomGreeting;
        }

        // Theme Setup
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            updateThemeIcon(isLight);
        }

        function updateThemeIcon(isLight) {
            document.getElementById('theme-icon').innerText = isLight ? 'dark_mode' : 'light_mode';
            document.getElementById('theme-text').innerText = isLight ? 'Toggle dark mode' : 'Toggle light mode';
        }

        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
            updateThemeIcon(true);
        }

        // Enter key to send
        inputField.addEventListener("keypress", (e) => {
            if (e.key === "Enter") { e.preventDefault(); sendData(); }
        });

        async function loadData() {
            const res = await fetch('/api/data');
            const json = await res.json();
            chatContainer.innerHTML = '';
            
            if (Object.keys(json.data).length > 0) {
                mainWrapper.classList.add('chat-active'); // Push input to bottom
                for (const [id, interaction] of Object.entries(json.data)) {
                    addMessageToUI(id, interaction.user, interaction.ai);
                }
                scrollToBottom();
            } else {
                mainWrapper.classList.remove('chat-active'); // Center input
                setRandomWelcome(); // Set random text if no chat history
            }
        }

        async function resetChat() {
            await fetch('/api/reset', { method: 'DELETE' });
            chatContainer.innerHTML = '';
            mainWrapper.classList.remove('chat-active'); // Returns input to center
            setRandomWelcome(); // Pick a new greeting!
            inputField.value = '';
            inputField.focus();
        }

        function addMessageToUI(id, userText, aiText) {
            const wrapper = document.createElement('div');
            wrapper.className = 'message-row';
            wrapper.innerHTML = `
                <div class="user-message">${escapeHTML(userText)}</div>
                <div class="ai-message">
                    <div class="ai-avatar"><span class="material-symbols-outlined">temp_preferences_custom</span></div>
                    <div>${formatText(escapeHTML(aiText))}</div>
                </div>
            `;
            chatContainer.appendChild(wrapper);
        }

        function scrollToBottom() { chatContainer.scrollTop = chatContainer.scrollHeight; }
        function escapeHTML(str) { return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)); }
        function formatText(str) { return str.replace(/\n/g, '<br>'); }

        async function sendData() {
            const text = inputField.value.trim();
            if (!text) return;
            
            // Switch layout to bottom if this is the first message
            if (!mainWrapper.classList.contains('chat-active')) {
                mainWrapper.classList.add('chat-active');
            }

            inputField.value = '';
            inputField.disabled = true;

            const tempId = 'temp-' + Date.now();
            const wrapper = document.createElement('div');
            wrapper.className = 'message-row';
            wrapper.id = tempId;
            wrapper.innerHTML = `
                <div class="user-message">${escapeHTML(text)}</div>
                <div class="ai-message">
                    <div class="ai-avatar"><span class="material-symbols-outlined">temp_preferences_custom</span></div>
                    <div class="loading-shimmer"></div>
                </div>
            `;
            chatContainer.appendChild(wrapper);
            scrollToBottom();
            
            try {
                const response = await fetch('/api/data', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });
                
                if(!response.ok) throw new Error("API request failed");
                const result = await response.json();
                
                document.getElementById(tempId).remove();
                addMessageToUI(result.id, result.data.user, result.data.ai);
                
            } catch (error) {
                document.getElementById(tempId).remove();
                alert("Error connecting to LLM. Please try again.");
            } finally {
                inputField.disabled = false;
                inputField.focus();
                scrollToBottom();
            }
        }

        loadData();
    </script>
</body>
</html>
