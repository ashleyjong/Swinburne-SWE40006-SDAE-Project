<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My LLM App</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        .item { border: 1px solid #ccc; padding: 10px; margin: 10px 0; border-radius: 5px; }
        button { background-color: #ff4d4f; color: white; border: none; padding: 5px 10px; cursor: pointer; }
        #submit-btn { background-color: #1890ff; padding: 10px 20px; font-size: 16px; }
    </style>
</head>
<body>
    <h1>Simulated LLM Pipeline App</h1>
    
    <div>
        <input type="text" id="userInput" placeholder="Enter text for the LLM..." style="width: 70%; padding: 10px;">
        <button id="submit-btn" onclick="sendData()">Submit (Write)</button>
    </div>

    <h2>Processed Data (Read)</h2>
    <div id="dataList">Loading...</div>

    <script>
        async function loadData() {
            const res = await fetch('/api/data');
            const json = await res.json();
            const container = document.getElementById('dataList');
            container.innerHTML = '';
            
            if (Object.keys(json.data).length === 0) {
                container.innerHTML = '<p>No data yet.</p>';
                return;
            }

            for (const [id, text] of Object.entries(json.data)) {
                container.innerHTML += `
                    <div class="item">
                        <p><strong>ID ${id}:</strong> ${text}</p>
                        <button onclick="deleteData(${id})">Delete</button>
                    </div>
                `;
            }
        }

        async function sendData() {
            const text = document.getElementById('userInput').value;
            if (!text) return;
            
            await fetch('/api/data', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            });
            document.getElementById('userInput').value = '';
            loadData();
        }

        async function deleteData(id) {
            await fetch(`/api/data/${id}`, { method: 'DELETE' });
            loadData();
        }

        // Load data on page start
        loadData();
    </script>
</body>
</html>
